[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-mcp"
version = "1.5.0"
description = "Industrialized FastMCP 3.1 server for Immich photo management with conversational AI, sampling, and SOTA 2026 fleet standards."
authors = [
    {name = "Sandra", email = "sandra@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["mcp", "immich", "photos", "fastmcp", "photography", "media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Utilities"
]

dependencies = [
    # Core FastMCP 3.1 (fleet standard)
    "fastmcp>=3.1,<4",
    "authlib>=1.2.0,<2.0.0",
    "httpx>=0.25.0,<1.0.0",
    "openapi-pydantic<=0.5.1",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "rich>=13.0.0,<14.0.0",
    "typer>=0.9.0,<1.0.0",
    # Additional project dependencies
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.23.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
dev = [
    # Testing (updated for FastMCP 2.10.2 compatibility)
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.11.1,<4.0.0",
    "pytest-httpx>=0.30.0,<1.0.0",  # For testing HTTPX clients
    "respx>=0.20.0,<1.0.0",        # For mocking HTTPX
    "pytest-timeout>=2.1.0,<3.0.0", # For test timeouts
    
    # Type checking and code quality
    "black>=23.7.0,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "ruff>=0.0.280,<1.0.0",
    "mypy>=1.4.0,<2.0.0",
    "types-python-dateutil>=2.8.19.0,<3.0.0",
    "types-requests>=2.31.0,<3.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
    
    # Documentation
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.1.0,<10.0.0",
    "mkdocstrings[python]>=0.22.0,<1.0.0",
    "mkdocstrings-python>=1.0.0,<2.0.0",
    
    # Development utilities
    "pre-commit>=3.3.0,<4.0.0",
    "ipython>=8.0.0,<9.0.0",
    "ipdb>=0.13.0,<1.0.0"
]

[project.urls]
Homepage = "https://github.com/sandra/immich-mcp"
Repository = "https://github.com/sandra/immich-mcp.git"
Documentation = "https://sandra.github.io/immich-mcp/"
Changelog = "https://github.com/sandra/immich-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/sandra/immich-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

# FastMCP 3.1 (config via env / run() where applicable)

# Black code formatter configuration
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

# Type checking configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "pydantic.*",
    "httpx.*",
    "starlette.*",
]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v --cov=immich_mcp --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/immich_mcp"]
parallel = true
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[project.scripts]
immich-mcp = "immich_mcp.server:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF", "C4", "SIM", "T20"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
