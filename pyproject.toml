[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-mcp"
version = "1.0.0"
description = "FastMCP 2.10 server for Immich photo management"
authors = [
    {name = "Sandra", email = "sandra@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["mcp", "immich", "photos", "fastmcp", "photography", "media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Utilities"
]

dependencies = [
    # Core dependencies
    "fastmcp>=2.10.0,<3.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.23.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    
    # HTTP client
    "httpx>=0.25.0,<1.0.0",
    
    # Utilities
    "rich>=13.0.0,<14.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "typing-extensions>=4.5.0,<5.0.0"
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.11.1,<4.0.0",
    "httpx>=0.25.0,<1.0.0",
    
    # Code quality
    "black>=23.7.0,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "ruff>=0.0.280,<1.0.0",
    "mypy>=1.4.0,<2.0.0",
    "types-python-dateutil>=2.8.19.0,<3.0.0",
    
    # Documentation
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.1.0,<10.0.0",
    "mkdocstrings[python]>=0.22.0,<1.0.0"
]

[project.urls]
Homepage = "https://github.com/sandra/immich-mcp"
Repository = "https://github.com/sandra/immich-mcp.git"
Documentation = "https://sandra.github.io/immich-mcp/"
Changelog = "https://github.com/sandra/immich-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/sandra/immich-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "FBT", # flake8-boolean-trap
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",  # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "TCH", # flake8-type-checking
    "T10", # flake8-debugger
    "N",  # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = [
    "B008",  # Do not perform function calls in argument defaults
    "D",     # Disable pydocstyle (handled by darglint)
    "E203",  # Whitespace before ':' (black conflict)
    "E501",  # Line too long (handled by black)
    "FBT002", # Boolean default argument in function definition
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "pydantic.*",
    "httpx.*",
    "starlette.*",
]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v --cov=immich_mcp --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/immich_mcp"]
parallel = true
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[project.scripts]
immich-mcp = "immich_mcp.server:main"
